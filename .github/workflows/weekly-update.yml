# Every Monday: adds new papers linked to the ORCID iD (tools/sync_pubs.py) and the
# latest Mauna Loa CO2 reading (tools/update_co2.py), then commits index.html if it changed.
# To run it now: Actions tab → "Weekly update" → "Run workflow".
name: Weekly update

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: New publications
        run: python3 tools/sync_pubs.py

      - name: Mauna Loa CO2
        run: python3 tools/update_co2.py

      - name: Commit, push and rebuild the site if index.html changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly update: publications and Mauna Loa CO2" -- index.html
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
